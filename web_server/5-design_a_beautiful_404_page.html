<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Page not found</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; box-sizing: border-box; background: #14213d; color: #fff; font-family: Verdana, sans-serif; }
  svg { width: min(320px, 80vw); animation: walk 2s ease-in-out infinite alternate; }
  h1 { font-size: 4rem; margin: 12px 0 0; color: #fca311; }
  p { margin: 8px; }
  a { margin-top: 16px; padding: 10px 22px; border-radius: 24px; background: #fca311; color: #14213d; text-decoration: none; font-weight: bold; }
  @keyframes walk { from { transform: translateX(-30px) rotate(-3deg); } to { transform: translateX(30px) rotate(3deg); } }
</style>
</head>
<body>
  <svg viewBox="0 0 200 220" role="img" aria-label="A lost sheet of paper walking away">
    <path d="M45 20h80l30 30v120H45z" fill="#fff"/>
    <path d="M125 20v30h30z" fill="#cfd6e6"/>
    <circle cx="82" cy="85" r="7" fill="#14213d"/>
    <circle cx="118" cy="85" r="7" fill="#14213d"/>
    <path d="M82 125q18-16 36 0" fill="none" stroke="#14213d" stroke-width="5" stroke-linecap="round"/>
    <path d="M75 170v30h-14M125 170v30h14M45 110l-24 20M155 110l24-20" fill="none" stroke="#fca311" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>404</h1>
  <p><strong>Ceci n'est pas une page</strong></p>
  <p>This page wandered off to learn something new.</p>
  <a href="/">Take me home</a>
</body>
</html>
