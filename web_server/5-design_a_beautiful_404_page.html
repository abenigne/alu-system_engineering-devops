<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Ceci n'est pas une page</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #fff;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    overflow: hidden;
  }
  .stars { position: fixed; inset: 0; z-index: 0; }
  .stars span {
    position: absolute;
    width: 3px; height: 3px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
  .content { position: relative; z-index: 1; padding: 20px; }
  h1 {
    font-size: clamp(6rem, 22vw, 14rem);
    letter-spacing: .05em;
    background: linear-gradient(90deg, #e94560, #f9a826);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: float 4s infinite ease-in-out;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
  .astronaut { font-size: 4rem; display: inline-block; animation: spin 8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h2 { font-size: 1.8rem; margin: 10px 0; font-weight: 300; }
  p { opacity: .8; margin-bottom: 30px; }
  a {
    display: inline-block;
    padding: 12px 32px;
    border-radius: 30px;
    background: #e94560;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    transition: transform .2s, box-shadow .2s;
  }
  a:hover { transform: scale(1.08); box-shadow: 0 0 20px #e94560; }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="content">
    <h1>404</h1>
    <div class="astronaut">🧑‍🚀</div>
    <h2>Ceci n'est pas une page</h2>
    <p>You drifted into empty space. The page you wanted doesn't exist.</p>
    <a href="/">Take me home</a>
  </div>
  <script>
    var s = document.getElementById("stars");
    for (var i = 0; i < 80; i++) {
      var d = document.createElement("span");
      d.style.left = Math.random() * 100 + "%";
      d.style.top = Math.random() * 100 + "%";
      d.style.animationDelay = Math.random() * 3 + "s";
      s.appendChild(d);
    }
  </script>
</body>
</html>
